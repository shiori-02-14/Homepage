<body id="coming-soon-page">

      <button class="theme-toggle theme-toggle--switch" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="ダークモードに切り替え" title="テーマを切り替え">

            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 1 0 11.5 11.5z"></path>

    </div>

  <main class="wrap">
    <section class="narrow coming-soon" aria-labelledby="coming-soon-title">
      <nav class="breadcrumb" aria-label="パンくずリスト">
        <ol class="breadcrumb__list">
          <li class="breadcrumb__item"><a href="index.html">Home</a></li>
          <li class="breadcrumb__item"><a href="works.html" id="breadcrumb-works">Works</a></li>
          <li class="breadcrumb__item" aria-current="page" id="breadcrumb-current">工事中</li>
        </ol>
      </nav>
      <p class="coming-soon__eyebrow">ただいま準備中です</p>
      <h1 id="coming-soon-title" class="coming-soon__title">工事中</h1>
      <p class="coming-soon__work" id="coming-soon-work" hidden></p>
      <figure class="coming-soon__figure">
        <img id="coming-soon-image" src="assets/icons/apps/under-construction.jpg" alt="工事中。UNDER CONSTRUCTION、COMING SOON" width="1024" height="576" decoding="async" />
      </figure>
      <p class="coming-soon__lead" id="coming-soon-lead">より良いサービスをお届けするために、現在準備を進めています。しばらくお待ちください。</p>
      <p class="coming-soon__note" id="coming-soon-note" hidden></p>
      <div class="section__cta">
        <a class="btn btn--ghost" id="coming-soon-back" href="works.html">← 作品一覧へ</a>
      </div>
    </section>

    <footer class="foot">
      <nav class="foot-social" aria-label="SNSリンク"></nav>
      <p class="foot-copy">© <span id="y"></span> しおり🔖</p>
    </footer>
  </main>

  <script>
    (() => {
      const works = {
        'learning-app': {
          id: 'learning-app',
          name: 'れきバト！',
          note: '※開発中',
          lead: '新感覚の日本史、世界史の学習アプリです。公開まで、もう少しお待ちください。',
          image: 'assets/icons/apps/rekibato.jpg',
          alt: 'れきバト！',
          logo: true
        },
        'ramen-app': {
          id: 'ramen-app',
          name: 'ラーメンアプリ',
          note: '※開発中'
        },
        'cheese-gyudon-coin': {
          id: 'cheese-gyudon-coin',
          name: '〇〇コイン（仮称）',
          note: '※検討中'
        },
        'note-tracker': {
          id: 'note-tracker',
          name: 'noteトラッカー',
          note: '※開発中'
        },
        'serif-maker': {
          id: 'serif-maker',
          name: 'セリフメーカー',
          note: '※開発中'
        }
      };
      works.rekibato = works['learning-app'];

      const key = new URLSearchParams(location.search).get('work');
      const work = key ? works[key] : null;
      if (!work) return;

      document.title = work.name + ' | 工事中 | しおり🔖';
      document.getElementById('breadcrumb-current').textContent = work.name;
      document.getElementById('breadcrumb-works').href = 'works.html#' + work.id;

      const nameEl = document.getElementById('coming-soon-work');
      nameEl.hidden = false;
      nameEl.textContent = work.name;

      if (work.lead) {
        document.getElementById('coming-soon-lead').textContent = work.lead;
      }
      if (work.note) {
        const noteEl = document.getElementById('coming-soon-note');
        noteEl.hidden = false;
        noteEl.textContent = work.note;
      }
      if (work.image) {
        const image = document.getElementById('coming-soon-image');
        image.src = work.image;
        image.alt = work.alt || work.name;
        if (work.logo) image.parentElement.classList.add('coming-soon__figure--logo');
      }
      document.getElementById('coming-soon-back').href = 'works.html#' + work.id;
    })();
  </script>
  <script src="js/main.js?v=20261003-coming-soon" defer></script>
